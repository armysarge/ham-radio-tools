name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Validate tag and changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > NOTES.md
          test -s NOTES.md
      - run: npm test
      - run: npm run build
      - run: npm run check:offline
      - name: Package web builds
        shell: bash
        run: |
          mkdir release
          cp LICENSE THIRD_PARTY_NOTICES.txt dist/
          (cd dist && zip -r "../release/ham-radio-tools-web-${GITHUB_REF_NAME#v}.zip" .)
          npm run build:demo
          cp LICENSE THIRD_PARTY_NOTICES.txt dist-demo/
          (cd dist-demo && zip -r "../release/ham-radio-tools-web-demo-${GITHUB_REF_NAME#v}.zip" .)
          cp NOTES.md release/NOTES.md
      - uses: actions/upload-artifact@v4
        with: { name: web, path: release/* }

  desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Install Electron runtime
        run: npx install-electron --no
      - name: Install Linux display and window manager
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb openbox x11-utils
      - name: Windows desktop smoke check
        if: runner.os == 'Windows'
        run: npm run check:desktop
      - name: Linux desktop smoke check
        if: runner.os == 'Linux'
        run: bash scripts/with-linux-display.sh npm run check:desktop
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HRT_DESKTOP_EXEC = (Resolve-Path 'desktop-out/win-unpacked/Ham Radio Tools.exe').Path
          node scripts/check-desktop.mjs
      - name: Verify packaged Linux application
        if: runner.os == 'Linux'
        run: HRT_DESKTOP_EXEC="$PWD/desktop-out/linux-unpacked/ham-radio-tools" bash scripts/with-linux-display.sh node scripts/check-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop-out/*.exe
            desktop-out/*.AppImage
            desktop-out/*.deb

  publish:
    needs: [web, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release, merge-multiple: true }
      - name: Create checksums and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd release
          sha256sum *.zip *.exe *.AppImage *.deb > SHA256SUMS.txt
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" *.zip *.exe *.AppImage *.deb SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --draft $PRE \
            --title "Ham Radio Tools $GITHUB_REF_NAME" --notes-file NOTES.md
