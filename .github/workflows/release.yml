name: Release

# Push a tag such as v0.3.0 (see docs/RELEASING.md). The workflow tests, builds and publishes the web build.
# Desktop installers (Windows / Linux) join the same release later via the commented job at the bottom.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "Tag v$TAG does not match package.json version $PKG"; exit 1; fi

      - run: npx vue-tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm run check:offline

      - name: Package the web build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          (cd dist && zip -r "../release/ham-radio-tools-web-${VERSION}.zip" .)
          (cd release && sha256sum *.zip > SHA256SUMS.txt)

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release/NOTES.md
          if [ ! -s release/NOTES.md ]; then echo "No CHANGELOG entry for $VERSION" >&2; exit 1; fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt \
            --title "Ham Radio Tools $GITHUB_REF_NAME" --notes-file release/NOTES.md $PRE

